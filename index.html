<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Herkesin Başkanı - Zıplama (Final)</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f1a;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  canvas{background:linear-gradient(#101a3a,#071021 65%,#050a16);border:2px solid #1f2a52;border-radius:14px;touch-action:none;max-width:100vw;max-height:100vh}
  .hud{position:fixed;left:12px;top:8px;color:#dbe3ff;font-weight:800;text-shadow:0 2px 8px #000}
  .msg{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:#0009;color:#fff;
        padding:8px 12px;border-radius:10px;font-weight:800;font-size:16px;display:none;}
  .panel{position:fixed;inset:0;display:none;place-items:center;background:linear-gradient(#0008,#000c);color:white;text-align:center}
  .panel .card{width:min(92vw,380px);background:#0f1733;border:1px solid #25305f;border-radius:16px;
               padding:18px 16px;box-shadow:0 12px 40px #0008}
  button{appearance:none;border:0;border-radius:12px;padding:10px 14px;font-weight:900;background:#6ae2ff;color:#071225;cursor:pointer}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div class="hud" id="hud">Skor: 0 | En iyi: 0</div>
<div class="msg" id="msg"></div>
<div class="panel" id="panel">

    <h2 style="margin:.2rem 0 .6rem">Oyun Bitti</h2>
    <div id="finalText" style="margin-bottom:12px;font-size:18px"></div>
    <button id="restart">Tekrar Oyna</button>

  </div>
</div>

  ];
  const headImg = new Image();
  headImg.src = "data:image/jpeg;base64," + B64_CHUNKS.join("");

  // OYUN AYARLARI (ULTRA KOLAY)
  const GROUND_Y = H - 70;
  const GRAV = 0.55;
  const JUMP_V = -14.5;
  const SPEED = 3.0; // sabit ve yavaş
  const GAP_MIN = 420, GAP_MAX = 560; // engel arası geniş

  const WIN_LINE = "Yaşasın yine ben kazandım!";
  const LOSE_LINE = "Diyar senin yüzünden kaybettim!";

  const player = {
    x:130, y:GROUND_Y,
    w:70, h:110,
    vy:0, onGround:true
  };

  let obstacles = [];
  let nextGap = 480;
  let score = 0;
  let gameOver = false;
  let sayCooldown = 0;

  function speak(text){
    try {
      if ("speechSynthesis" in window) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "tr-TR";
        u.rate = 1.0;
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      }
    } catch(e) {}
  }

  function showMsg(text){
    msgBox.textContent = text;
    msgBox.style.display = "block";
    clearTimeout(showMsg._t);
    showMsg._t = setTimeout(()=>msgBox.style.display="none", 900);
  }

  function spawnObstacle(){
    const h = 16 + Math.random()*14; // alçak engel
    const w = 22 + Math.random()*24;
    obstacles.push({
      x:W+40, y:GROUND_Y-h, w, h, passed:false
    });
  }

  function reset(){
    obstacles=[];
    score=0;
    nextGap = 480;
    gameOver=false;
    panel.style.display="none";
    player.y=GROUND_Y; player.vy=0; player.onGround=true;
    for(let i=0;i<2;i++) spawnObstacle();
  }

  function jump(){
    if(gameOver) return;
    if(player.onGround){
      player.vy = JUMP_V;
      player.onGround=false;
    }
  }

  addEventListener("keydown", e=>{
    if(e.key===" "||e.key==="ArrowUp"||e.key==="w"||e.key==="W") jump();
    if(gameOver && (e.key===" "||e.key==="Enter")) reset();
  });
  canvas.addEventListener("pointerdown", jump);

  function rectHit(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  function update(){
    if(gameOver) return;

    // fizik
    player.vy += GRAV;
    player.y += player.vy;
    if(player.y>=GROUND_Y){
      player.y=GROUND_Y; player.vy=0; player.onGround=true;
    }

    // engeller ilerle
    for(const o of obstacles) o.x -= SPEED;

    // yeni engel
    const last = obstacles[obstacles.length-1];
    if(last && last.x < W-nextGap){
      spawnObstacle();
      nextGap = GAP_MIN + Math.random()*(GAP_MAX-GAP_MIN);
    }
    obstacles = obstacles.filter(o=>o.x+o.w>-40);

    // geçti mi?
    for(const o of obstacles){
      if(!o.passed && o.x+o.w < player.x){
        o.passed=true; score++;
        if(sayCooldown<=0){
          showMsg(WIN_LINE);
          speak(WIN_LINE);
          sayCooldown = 50;
        }
      }
    }

    // çarpışma (affedici kutu)
    const pr = {
      x:player.x+12,
      y:player.y-player.h+30,
      w:player.w-24,
      h:player.h-30
    };
    for(const o of obstacles){
      if(rectHit(pr,o)){
        gameOver=true;
        best=Math.max(best,score);
        localStorage.setItem("baskanbest_final",best);
        finalText.innerHTML = `<b>${LOSE_LINE}</b><br>Skor: ${score} | En iyi: ${best}`;
        panel.style.display="grid";
        showMsg(LOSE_LINE);
        speak(LOSE_LINE);
        break;
      }
    }

    if(sayCooldown>0) sayCooldown--;
    hud.textContent = `Skor: ${score} | En iyi: ${best}`;
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.fill();
  }

  function drawPlayer(){
    const bodyX=player.x;
    const bodyTop=player.y-player.h;

    // karikatür gövde
    ctx.fillStyle="#2dd4bf";
    roundRect(bodyX, bodyTop+38, player.w, player.h-38, 12);

    // kravat detayı
    ctx.fillStyle="#0b1020";
    ctx.fillRect(bodyX+player.w/2-3, bodyTop+56, 6, 26);

    // kafa (DAİRE, GÖVDEYE SABİT)
    const headR=34;
    const cx=bodyX+player.w/2;
    const cy=bodyTop+34;

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx,cy,headR,0,Math.PI*2);
    ctx.clip();

    if(headImg.complete && headImg.naturalWidth){
      const s=Math.min(headImg.naturalWidth, headImg.naturalHeight);
      const sx=(headImg.naturalWidth-s)/2;
      const sy=(headImg.naturalHeight-s)/2;
      ctx.drawImage(headImg, sx,sy,s,s, cx-headR, cy-headR, headR*2, headR*2);
    } else {
      ctx.fillStyle="#ffd166";
      ctx.fillRect(cx-headR, cy-headR, headR*2, headR*2);
    }
    ctx.restore();

    ctx.lineWidth=3;
    ctx.strokeStyle="#0b1020";
    ctx.beginPath(); ctx.arc(cx,cy,headR,0,Math.PI*2); ctx.stroke();

    // alt yazı
    ctx.fillStyle="#fff";
    ctx.font="800 13px system-ui";
    ctx.textAlign="center";
    ctx.fillText("HERKESİN BAŞKANI", cx, player.y+18);
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    // zemin
    ctx.fillStyle="#0d132d";
    ctx.fillRect(0,GROUND_Y+8,W,H-GROUND_Y);

    // arkaplan silüet
    ctx.globalAlpha=.12;
    ctx.fillStyle="#9db4ff";
    for(let i=0;i<18;i++){
      const bw=40+((i*17)%30), bh=30+((i*29)%80);
      const bx=i*55 - (score*SPEED*0.18)%55;
      ctx.fillRect(bx, GROUND_Y-bh, bw, bh);
    }
    ctx.globalAlpha=1;

    // engeller
    for(const o of obstacles){
      ctx.fillStyle="#ff7aa2";
      roundRect(o.x,o.y,o.w,o.h,6);
      ctx.fillStyle="rgba(255,255,255,.25)";
      roundRect(o.x+3,o.y+3,o.w-6,4,3);
    }

    drawPlayer();
  }

  function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
  }

  restartBtn.onclick = reset;
  headImg.onload = () => { reset(); loop(); };
  headImg.onerror = () => { reset(); loop(); };

})();
</script>
</body>
</html>
